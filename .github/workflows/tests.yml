name: tests

# Repo private: kuota GitHub Actions terbatas. Suite PHP 8.4 dijalankan di mesin pengembang
# per fitur; CI hanya memeriksa PHP 8.3 (target cPanel) saat push ke main atau dijalankan manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest (PHP 8.3)
    runs-on: ubuntu-latest
    # Suite ±2 menit di laptop (3 proses); di runner diperkirakan ±10 menit. Batas ketat agar run yang
    # macet tidak menghabiskan kuota menit repo private.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3, fileinfo, exif
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build aset
        # Beberapa test memeriksa public/build/manifest.json (paket rilis).
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Siapkan .env
        # Seeder super-admin butuh kata sandi, dan beberapa test URL mengandaikan APP_URL tanpa port.
        run: |
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost|' .env
          sed -i 's|^SUPER_ADMIN_PASSWORD=.*|SUPER_ADMIN_PASSWORD=ci-password-only|' .env
          php artisan key:generate

      - name: Jalankan test
        # Runner GitHub punya 4 vCPU.
        run: php artisan test --compact --parallel --processes=4
